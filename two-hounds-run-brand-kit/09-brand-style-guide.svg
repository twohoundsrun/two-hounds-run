<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Two Hounds Run brand style guide</title>
  <desc id="desc">Color palette, typography, tagline, and basic brand usage guidance.</desc>
  <rect width="1600" height="1000" fill="#081A2D"/>
  <path d="M0 770 C260 650 420 900 690 760 S1150 650 1600 800" fill="none" stroke="#2F80ED" stroke-width="3" opacity="0.22"/>
  <path d="M0 825 C280 705 450 940 720 815 S1180 710 1600 855" fill="none" stroke="#9ED7F5" stroke-width="2" opacity="0.16"/>

  <text x="88" y="112" fill="#F7F9FC" font-family="Sora, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="3">TWO HOUNDS</text>
  <text x="91" y="171" fill="#2F80ED" font-family="Sora, Arial, sans-serif" font-size="45" font-weight="600" letter-spacing="24">RUN</text>
  <text x="88" y="230" fill="#9ED7F5" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="400">Practical tools. Built for the long run.</text>

  <text x="88" y="330" fill="#F7F9FC" font-family="Sora, Arial, sans-serif" font-size="28" font-weight="600">COLOR PALETTE</text>

  <g font-family="Inter, Arial, sans-serif" font-size="19">
    <g transform="translate(88 370)">
      <rect width="205" height="132" rx="16" fill="#081A2D" stroke="#40536A"/>
      <text x="16" y="86" fill="#F7F9FC" font-weight="600">Midnight Navy</text>
      <text x="16" y="113" fill="#9ED7F5">#081A2D</text>
    </g>
    <g transform="translate(313 370)">
      <rect width="205" height="132" rx="16" fill="#121820" stroke="#40536A"/>
      <text x="16" y="86" fill="#F7F9FC" font-weight="600">Charcoal</text>
      <text x="16" y="113" fill="#9ED7F5">#121820</text>
    </g>
    <g transform="translate(538 370)">
      <rect width="205" height="132" rx="16" fill="#2F80ED"/>
      <text x="16" y="86" fill="#F7F9FC" font-weight="600">Route Blue</text>
      <text x="16" y="113" fill="#F7F9FC">#2F80ED</text>
    </g>
    <g transform="translate(763 370)">
      <rect width="205" height="132" rx="16" fill="#9ED7F5"/>
      <text x="16" y="86" fill="#081A2D" font-weight="600">Trail Blue</text>
      <text x="16" y="113" fill="#081A2D">#9ED7F5</text>
    </g>
    <g transform="translate(988 370)">
      <rect width="205" height="132" rx="16" fill="#B88455"/>
      <text x="16" y="86" fill="#081A2D" font-weight="600">Hound Tan</text>
      <text x="16" y="113" fill="#081A2D">#B88455</text>
    </g>
    <g transform="translate(1213 370)">
      <rect width="205" height="132" rx="16" fill="#F7F9FC"/>
      <text x="16" y="86" fill="#081A2D" font-weight="600">Snow White</text>
      <text x="16" y="113" fill="#081A2D">#F7F9FC</text>
    </g>
  </g>

  <text x="88" y="610" fill="#F7F9FC" font-family="Sora, Arial, sans-serif" font-size="28" font-weight="600">TYPOGRAPHY</text>
  <text x="88" y="686" fill="#F7F9FC" font-family="Sora, Arial, sans-serif" font-size="48" font-weight="700">Sora Bold — Headlines</text>
  <text x="88" y="740" fill="#9ED7F5" font-family="Sora, Arial, sans-serif" font-size="28" font-weight="600">Sora SemiBold — Subheads and buttons</text>
  <text x="88" y="792" fill="#F7F9FC" font-family="Inter, Arial, sans-serif" font-size="25">Inter Regular — Clear, approachable body copy and interface text.</text>

  <g transform="translate(1045 600)">
    <rect width="373" height="237" rx="22" fill="#121820" stroke="#2F80ED" stroke-width="2"/>
    <text x="30" y="55" fill="#9ED7F5" font-family="Sora, Arial, sans-serif" font-size="21" font-weight="600">BRAND CHARACTER</text>
    <text x="30" y="101" fill="#F7F9FC" font-family="Inter, Arial, sans-serif" font-size="22">Practical</text>
    <text x="30" y="137" fill="#F7F9FC" font-family="Inter, Arial, sans-serif" font-size="22">Personal</text>
    <text x="30" y="173" fill="#F7F9FC" font-family="Inter, Arial, sans-serif" font-size="22">Capable</text>
    <text x="190" y="101" fill="#F7F9FC" font-family="Inter, Arial, sans-serif" font-size="22">Adventurous</text>
    <text x="190" y="137" fill="#F7F9FC" font-family="Inter, Arial, sans-serif" font-size="22">Direct</text>
    <text x="190" y="173" fill="#F7F9FC" font-family="Inter, Arial, sans-serif" font-size="22">Forward-moving</text>
  </g>

  <text x="88" y="925" fill="#9ED7F5" font-family="Inter, Arial, sans-serif" font-size="20">Use the full logo for introductions; use the mark where the name is already visible. Keep one-ear clear space around every version.</text>
</svg>
